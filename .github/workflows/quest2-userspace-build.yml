name: Quest 2 offline ARM64 gaming userspace

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quest2-offline-userspace
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'WitherBlitz/Quest-2-Steam-OS-Dual-Boot' && github.actor == 'WitherBlitz'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify native ARM64 host and install build dependencies
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang gcc-x86-64-linux-gnu libc6-dev-amd64-cross
      - name: Build and test the isolated gaming userspace
        run: bash tools/ci/quest2_userspace_build.sh
      - name: Upload build, corresponding source and CI-owned evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quest2-gaming-userspace-${{ github.run_id }}
          path: ci-userspace-artifacts/
          if-no-files-found: warn
          retention-days: 7
