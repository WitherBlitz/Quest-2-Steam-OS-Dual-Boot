name: Quest 2 sparse reader Linux QEMU check

on:
  workflow_dispatch:
    inputs:
      transition_el1:
        description: Also execute the production transition in isolated QEMU EL1 RAM
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  transition:
    if: inputs.transition_el1 && github.repository == 'WitherBlitz/Quest-2-Steam-OS-Dual-Boot' && github.actor == 'WitherBlitz'
    uses: ./.github/workflows/quest2-transition-check.yml

  check:
    if: github.repository == 'WitherBlitz/Quest-2-Steam-OS-Dual-Boot' && github.actor == 'WitherBlitz'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install official Ubuntu compiler and QEMU packages
        timeout-minutes: 5
        run: |
          # Match the verified target-build mirror workaround; retain signatures.
          test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
          mkdir -p "$RUNNER_TEMP/qkx-apt-empty"
          cat > "$RUNNER_TEMP/qkx-ubuntu.list" <<'EOF'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          EOF
          qkx_apt=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/qkx-ubuntu.list"
                   -o "Dir::Etc::sourceparts=$RUNNER_TEMP/qkx-apt-empty"
                   -o Acquire::https::Timeout=30 -o Acquire::Retries=2)
          sudo apt-get "${qkx_apt[@]}" update -qq
          sudo apt-get "${qkx_apt[@]}" install -y --no-install-recommends clang lld llvm qemu-user
      - name: Build and execute the static reader against CI-owned memory
        run: python3 -B tools/ci/quest2_csl_read_linux.py
      - name: Run host regression tests
        env:
          HOST_TEST_CC: clang
        run: python3 -B -m unittest discover -s tools/tests -p 'test_*.py' -v > reader-ci-artifacts/host-tests.log 2>&1
      - name: Upload allowlisted Linux QEMU evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quest2-csl-reader-linux-qemu-${{ github.run_id }}
          path: |
            reader-ci-artifacts/quest2_csl_read
            reader-ci-artifacts/quest2_csl_read.c
            reader-ci-artifacts/LICENSE
            reader-ci-artifacts/proof.json
            reader-ci-artifacts/build.log
            reader-ci-artifacts/execution.log
            reader-ci-artifacts/host-tests.log
          if-no-files-found: warn
          retention-days: 7
