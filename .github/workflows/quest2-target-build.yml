name: Quest 2 offline Linux target build

on:
  workflow_dispatch:
    inputs:
      target_profile:
        description: Offline development profile; hardware handoff stays blocked
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - startup-gic-pending
          - startup-usb-child

permissions:
  contents: read

concurrency:
  group: quest2-offline-target
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'WitherBlitz/Quest-2-Steam-OS-Dual-Boot' && github.actor == 'WitherBlitz'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install offline build dependencies
        timeout-minutes: 10
        run: |
          # Avoid the runner's Azure mirror after observed package timeouts.
          test -s /usr/share/keyrings/ubuntu-archive-keyring.gpg
          mkdir -p "$RUNNER_TEMP/qkx-apt-empty"
          cat > "$RUNNER_TEMP/qkx-ubuntu.list" <<'EOF'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          EOF
          qkx_apt=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/qkx-ubuntu.list"
                   -o "Dir::Etc::sourceparts=$RUNNER_TEMP/qkx-apt-empty"
                   -o Acquire::https::Timeout=30 -o Acquire::Retries=2)
          sudo apt-get "${qkx_apt[@]}" update -qq
          sudo apt-get "${qkx_apt[@]}" install -y --no-install-recommends build-essential bc bison flex libssl-dev libelf-dev dwarves libtinfo5 binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user curl kmod
      - name: Build public-config Linux target and BusyBox initramfs
        env:
          QKX_TARGET_PROFILE: ${{ inputs.target_profile || 'baseline' }}
        run: bash tools/ci/quest2_target_build.sh
      - name: Upload allowlisted target outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quest2-linux-${{ inputs.target_profile || 'baseline' }}-${{ github.run_id }}
          path: ci-target-artifacts/
          if-no-files-found: warn
          retention-days: 7
