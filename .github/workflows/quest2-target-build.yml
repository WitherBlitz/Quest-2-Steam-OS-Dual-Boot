name: Quest 2 offline Linux baseline build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quest2-offline-target
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'WitherBlitz/Quest-2-Steam-OS-Dual-Boot' && github.actor == 'WitherBlitz'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install offline build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex libssl-dev libelf-dev dwarves libtinfo5 binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu qemu-user curl
      - name: Build public-config Linux baseline and BusyBox initramfs
        run: bash tools/ci/quest2_target_build.sh
      - name: Upload allowlisted baseline outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quest2-linux-baseline-${{ github.run_id }}
          path: ci-target-artifacts/
          if-no-files-found: warn
          retention-days: 7
