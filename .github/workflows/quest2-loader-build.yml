name: Quest 2 matching loader build

on:
  workflow_dispatch:
    inputs:
      owner_gate:
        description: Build default-off/enabled driver entry accounting and isolated self-test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quest2-matching-loader
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'WitherBlitz/Quest-2-Steam-OS-Dual-Boot' && github.actor == 'WitherBlitz'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex libssl-dev libelf-dev dwarves libtinfo5 binutils-aarch64-linux-gnu kmod curl
      - name: Build pinned kernel and stage-only loader
        env:
          Q2_CONFIG_GZ_B64: ${{ secrets.QUEST2_CONFIG_52242990024200150_GZ_B64 }}
          QKX_OWNER_BUILD: ${{ inputs.owner_gate && '1' || '0' }}
        run: bash tools/ci/quest2_build.sh
      - name: Upload allowlisted build outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quest2-loader-build-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 7
